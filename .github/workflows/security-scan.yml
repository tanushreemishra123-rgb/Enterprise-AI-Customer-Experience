name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan Python code
        run: semgrep scan --config p/security-audit --config p/python --severity ERROR --error .

  python-security:
    name: Bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: python -m pip install --upgrade bandit pip-audit
      - name: Fail on high-severity Bandit findings
        run: bandit -r starter-solution mock-services -lll
      - name: Audit declared Python dependencies
        run: pip-audit --requirement requirements.txt

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
